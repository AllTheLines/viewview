[package]
name = "tasks"
version = "0.1.0"
edition = "2024"

[dependencies]
apalis = { version = "1.0.0-beta.2", features = ["tracing"] }
apalis-board-api = { version = "1.0.0-beta.1", features = ["axum"] }
apalis-sqlite = "1.0.0-beta.3"
async-trait = "0.1.89"
async-ssh2-tokio = "0.12.0"
axum = { version = "0.8", features = ["json", "tokio", "query"] }
bytemuck = { version = "1.23.2", features = ["derive"] }
clap.workspace = true
color-eyre.workspace = true
futures = "0.3.31"
gdal = { version = "0.19.0", features = ["bindgen"] }
geo.workspace = true
geojson = { version = "0.24.2", features = ["geo-types"] }
h3o = "0.9.4"
proj4rs.workspace = true
rstar.workspace = true
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
srtm_reader = "0.5.1"
sqlx.workspace = true
tokio = { version = "1.48.0", features = ["full", "tracing"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http = { version = "0.6.7", features = ["fs", "normalize-path"] }
strip-ansi-escapes = "0.2.1"
csv = "1.4.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.22.0"
