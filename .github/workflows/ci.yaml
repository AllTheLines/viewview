name: CI

# Note: when forking on GitHub, workflows are disabled-by-default; the jobs
# won't run when pushing to the fork and there won't be a button to run
# anything manually. Owners of the fork can, through the website, re-enable
# these workflows to run as specified here.
on:
  push:
    branches:
      - main
  pull_request: {}

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test 🔬
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install libgdal-dev gdal-bin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose --all
      - name: Run tests
        run: cargo test

  lints:
    name: "Lints 💅"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        working-directory: website
        run: pnpm install

      - name: Svelte
        working-directory: website
        run: node_modules/.bin/svelte-check
      - name: Biome
        working-directory: website
        run: node_modules/.bin/biome check

